services:
  # ========== FastAPI 应用 ==========
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ifrench-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ifrench
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./backend:/app
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ifrench-network
    restart: unless-stopped

  # ========== Neo4j 图数据库 ==========
  neo4j:
    image: neo4j:5.26-community
    container_name: ifrench-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ifrench-network
    restart: unless-stopped

  # ========== PostgreSQL 关系数据库 ==========
  postgres:
    image: postgres:16-alpine
    container_name: ifrench-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ifrench
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ifrench"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ifrench-network
    restart: unless-stopped

  # ========== MinIO 对象存储 ==========
  minio:
    image: minio/minio:latest
    container_name: ifrench-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ifrench-network
    restart: unless-stopped

  # ========== Nginx 反向代理（生产环境） ==========
  nginx:
    image: nginx:alpine
    container_name: ifrench-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - api
    networks:
      - ifrench-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  minio_data:

networks:
  ifrench-network:
    driver: bridge
